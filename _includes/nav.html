<header class="site-header">
  <div class="bar">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.texture.title | default: site.title }}</a>
    {%- if site.texture.showNav -%}
    <nav aria-label="Main">
      {%- for link in site.texture.navigation -%}
      <a href="{{ link.url | prepend: site.baseurl }}"{% if link.url == page.url %} class="active" aria-current="page"{% endif %}>{{ link.title }}</a>
      {%- endfor -%}
    </nav>
    {%- endif -%}
  </div>
</header>
